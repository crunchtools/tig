# =============================================================================
# TIG stack — Nagios host and service definitions
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/tig.cfg
#
# Self-contained: hosts join their hostgroup with `hostgroups`, and services
# join the NRPE pool servicegroups with `servicegroups`, so nothing else on the
# server has to be edited. The pool membership matters — it is what suppresses
# these checks' notifications when the NRPE daemon serving them is down
# (nrpe-dependency.cfg). Install the commands from nrpe-commands.cfg on the agent.
#
# What each layer proves: "running" and the port checks show the processes are
# alive; "Metrics freshness" shows the pipeline is delivering; "HTTPS external"
# shows a person can reach Grafana through the proxy.
# =============================================================================

define host {
    use                 crunchtools-container
    host_name           ctr-influxdb.crunchtools.com
    hostgroups          infrastructure
    alias               influxdb container
    address             10.88.0.1
    check_command       check_nrpe_ctr!10.88.0.1!check_ctr_run_influxdb
}

define service {
    use                     crunchtools-service
    host_name               ctr-influxdb.crunchtools.com
    service_description     Container memory
    check_command           check_nrpe_ctr!10.88.0.1!check_ctr_mem_influxdb
    servicegroups           nrpe-ctr-pool
    notes                   Container capped at 768m; cache limited to 256 MiB in config.yml
}

define service {
    use                     crunchtools-service
    host_name               ctr-influxdb.crunchtools.com
    service_description     InfluxDB port
    check_command           check_nrpe_command!10.88.0.1!check_tcp_8099
    servicegroups           nrpe-fast-pool
    notes                   HTTP API published on 127.0.0.1:8099 for the Telegraf collector
}

define service {
    use                     crunchtools-service
    host_name               ctr-influxdb.crunchtools.com
    service_description     Metrics freshness
    check_command           check_nrpe_ctr!10.88.0.1!check_tig_freshness
    servicegroups           nrpe-ctr-pool
    notes                   Age of the newest Telegraf point. Warns at 5m, critical at 15m. If this is red the graphs are flat and the trend alerts are blind, even though every container check is green.
}

