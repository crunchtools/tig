# NRPE command definitions for the TIG stack. The source of truth for the
# agent's command files is crunchtools/nagios-agent (deploy/nagios-agent/);
# these lines are mirrored there.
#
# check_tig_freshness.sh ships in the nagios-agent image, alongside every other
# plugin, so the agent's plugin drift check covers it.

# nrpe-host.cfg (fast pool, port 5666)
command[check_tcp_8029]=/usr/local/nagios/libexec/check_tcp_local.sh 8029
command[check_tcp_8098]=/usr/local/nagios/libexec/check_tcp_local.sh 8098
command[check_tcp_8099]=/usr/local/nagios/libexec/check_tcp_local.sh 8099

# nrpe-ctr.cfg (container pool, port 5667)
command[check_ctr_run_influxdb]=/usr/local/nagios/libexec/check_container_running.sh influxdb.crunchtools.com
command[check_ctr_mem_influxdb]=/usr/local/nagios/libexec/check_container_memory.sh influxdb.crunchtools.com
command[check_ctr_run_grafana]=/usr/local/nagios/libexec/check_container_running.sh grafana.crunchtools.com
command[check_ctr_mem_grafana]=/usr/local/nagios/libexec/check_container_memory.sh grafana.crunchtools.com
command[check_ctr_run_telegraf]=/usr/local/nagios/libexec/check_container_running.sh telegraf.crunchtools.com
command[check_ctr_mem_telegraf]=/usr/local/nagios/libexec/check_container_memory.sh telegraf.crunchtools.com
command[check_ctr_run_mcp_grafana]=/usr/local/nagios/libexec/check_container_running.sh mcp-grafana
command[check_ctr_mem_mcp_grafana]=/usr/local/nagios/libexec/check_container_memory.sh mcp-grafana
command[check_tig_freshness]=/usr/local/nagios/libexec/check_tig_freshness.sh 300 900
