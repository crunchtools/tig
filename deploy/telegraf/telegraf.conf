# Telegraf collector. Installed to /srv/telegraf.crunchtools.com/config/ and
# mounted read-only at /etc/telegraf.
#
# The container shares the host PID and network namespaces, so /proc already
# shows the host. Only filesystem usage needs the host root, mounted at /hostfs
# and named by HOST_MOUNT_PREFIX in the unit.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "30s"
  flush_jitter = "5s"
  omit_hostname = false
  skip_processors_after_aggregators = true

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ── Priority 1: host CPU, disk I/O, network ──────────────────────────────────

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.diskio]]
  # Whole disks only; partitions and device-mapper children double-count.
  devices = ["sd[a-z]", "vd[a-z]", "nvme*n[0-9]"]

[[inputs.net]]
  # Physical and bridge interfaces. The per-container veth pairs come and go
  # with every restart and would grow the series count without bound.
  interfaces = ["e*", "podman*", "wg*"]

[[inputs.mem]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "efivarfs", "composefs"]

# ── Priority 3: per-container CPU, memory, state ─────────────────────────────

[[inputs.docker]]
  # Podman serves the Docker-compatible API on its socket.
  endpoint = "unix:///run/podman/podman.sock"
  timeout = "20s"
  # Totals only. Per-CPU, per-interface and per-block-device series for ~60
  # containers would multiply the series count for nothing anyone graphs.
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_exclude = ["*"]
  source_tag = false

# ── Priority 2: file descriptors by type, database counters ──────────────────

[[inputs.exec]]
  commands = [["/usr/local/libexec/telegraf/fd_types.py"]]
  interval = "60s"
  timeout = "20s"
  data_format = "influx"

[[inputs.exec]]
  commands = [["/usr/local/libexec/telegraf/ctr_db_status.py", "/etc/telegraf/db-containers.conf"]]
  interval = "60s"
  timeout = "30s"
  data_format = "influx"
