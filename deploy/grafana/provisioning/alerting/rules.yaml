# Trend alert rules — the slope detection Cacti+THOLD used to do.
#
# Each rule compares a rate of change (6-hour window) against the headroom
# left, and fires on time-to-exhaustion rather than on a level. Nagios owns the
# level thresholds; these only answer "is it about to break?".
#
# disk-time-to-full also requires the 24-hour rate to agree. A one-off step of
# X bytes reads as X/6 per hour for six hours, so on the 6-hour rate alone any
# image pull over 1/28 of the free space "filled the disk within 7 days". With
# both windows a step has to exceed 1/7 of the free space.
#
# Warm-up guard: every rule also requires six 30-minute slope samples (N >= 6),
# that is three hours of history. A slope over twenty minutes of data is the
# start-up ramp of whatever was just restarted, not a trend.

apiVersion: 1
groups:
- orgId: 1
  name: trends
  folder: TIG Alerts
  interval: 5m
  rules:
  - uid: disk-time-to-full
    title: Disk fills within 7 days
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "disk" and r._field == "used")
            |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
            |> derivative(unit: 1h, nonNegative: false)
            |> keep(columns: ["_time", "_value", "path"])
            |> group(columns: ["path"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: A24
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: influxdb
      model:
        refId: A24
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "disk" and r._field == "used")
            |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
            |> derivative(unit: 1h, nonNegative: false)
            |> keep(columns: ["_time", "_value", "path"])
            |> group(columns: ["path"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: B
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: B
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "disk" and r._field == "free")
            |> aggregateWindow(every: 5m, fn: last, createEmpty: false)
            |> keep(columns: ["_time", "_value", "path"])
            |> group(columns: ["path"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: RA
      datasourceUid: __expr__
      model:
        refId: RA
        type: reduce
        expression: A
        reducer: mean
        settings:
          mode: dropNN
    - refId: RA24
      datasourceUid: __expr__
      model:
        refId: RA24
        type: reduce
        expression: A24
        reducer: mean
        settings:
          mode: dropNN
    - refId: RB
      datasourceUid: __expr__
      model:
        refId: RB
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
    - refId: N
      datasourceUid: __expr__
      model:
        refId: N
        type: reduce
        expression: A
        reducer: count
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $N >= 6 && $RA > 0 && $RA24 > 0 && ($RB / $RA) < 168 && ($RB / $RA24) < 168
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: At the growth rate of both the last 6 and the last 24 hours, {{ $labels.path }} is full in under 7 days.
  - uid: memory-time-to-exhaustion
    title: Available memory exhausted within 24 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "mem" and r._field == "available")
            |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
            |> derivative(unit: 1h, nonNegative: false)
            |> keep(columns: ["_time", "_value", "host"])
            |> group(columns: ["host"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: B
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: B
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "mem" and r._field == "available")
            |> aggregateWindow(every: 5m, fn: last, createEmpty: false)
            |> keep(columns: ["_time", "_value", "host"])
            |> group(columns: ["host"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: RA
      datasourceUid: __expr__
      model:
        refId: RA
        type: reduce
        expression: A
        reducer: mean
        settings:
          mode: dropNN
    - refId: RB
      datasourceUid: __expr__
      model:
        refId: RB
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
    - refId: N
      datasourceUid: __expr__
      model:
        refId: N
        type: reduce
        expression: A
        reducer: count
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $N >= 6 && ($RA < 0 && ($RB / (0 - $RA)) < 24)
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Available memory on {{ $labels.host }} has been falling for 6 hours and runs out in under 24.
  - uid: swap-growth
    title: Swap grew more than 1 GiB in 6 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "swap" and r._field == "used")
            |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
            |> derivative(unit: 1h, nonNegative: false)
            |> keep(columns: ["_time", "_value", "host"])
            |> group(columns: ["host"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: RA
      datasourceUid: __expr__
      model:
        refId: RA
        type: reduce
        expression: A
        reducer: mean
        settings:
          mode: dropNN
    - refId: N
      datasourceUid: __expr__
      model:
        refId: N
        type: reduce
        expression: A
        reducer: count
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $N >= 6 && (($RA * 6) > 1073741824)
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Swap in use on {{ $labels.host }} grew by more than 1 GiB over the last 6 hours.
  - uid: container-memory-time-to-limit
    title: Container reaches its memory limit within 12 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "docker_container_mem" and r._field == "usage_percent")
            |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
            |> derivative(unit: 1h, nonNegative: false)
            |> keep(columns: ["_time", "_value", "container_name"])
            |> group(columns: ["container_name"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: B
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: influxdb
      model:
        refId: B
        query: |-
          from(bucket: "telegraf")
            |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            |> filter(fn: (r) => r._measurement == "docker_container_mem" and r._field == "usage_percent")
            |> aggregateWindow(every: 5m, fn: last, createEmpty: false)
            |> keep(columns: ["_time", "_value", "container_name"])
            |> group(columns: ["container_name"])
        intervalMs: 30000
        maxDataPoints: 1000
    - refId: RA
      datasourceUid: __expr__
      model:
        refId: RA
        type: reduce
        expression: A
        reducer: mean
        settings:
          mode: dropNN
    - refId: RB
      datasourceUid: __expr__
      model:
        refId: RB
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
    - refId: N
      datasourceUid: __expr__
      model:
        refId: N
        type: reduce
        expression: A
        reducer: count
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $N >= 6 && ($RB > 60 && $RA > 0 && ((100 - $RB) / $RA) < 12)
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.container_name }} is above 60% of its memory limit and climbing; it hits the limit in under 12
        hours.'
