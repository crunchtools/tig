; Grafana configuration. Installed to /srv/grafana.crunchtools.com/config/ and
; mounted read-only at /etc/grafana. Secrets arrive as GF_* environment
; variables from grafana.env, never from this file.

[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000
domain = grafana.crunchtools.com
root_url = https://grafana.crunchtools.com/
enforce_domain = false

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[security]
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

; Identity is asserted by the reverse proxy, the same shape Nagios uses with
; cgi.cfg default_user_name=admin. proxy.crunchtools.com sets X-WEBAUTH-USER to
; the admin login once a request has cleared Cloudflare Access; Grafana trusts it
; only from 127.0.0.1 (the proxy runs --network host and reaches us on loopback).
; The login form stays enabled as break-glass for direct-to-origin access with
; the OpenBao admin password. See RT #1461.
[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = false
sync_ttl = 60
whitelist = 127.0.0.1
headers_encoded = false
enable_login_token = false

[unified_alerting]
enabled = true

[plugins]
; Grafana 13 ships its datasources as bundled plugins, unpacks them into the
; data directory and starts a backend process for each one. Only InfluxDB is
; used here; the other twelve would each cost a process inside a 512 MB cap.
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,jaeger,loki,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin
plugin_admin_enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/host.json
