name: Container

# Build once, gate the digest, promote what was tested (container-image VII).
# The gate is tests/test-image.sh: it runs all three roles (influxd, telegraf,
# grafana) from the built digest and checks they work together.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday rebuild
  workflow_dispatch:

permissions: {}

jobs:
  # Blocking AI-slop gate, required by constitution XII.
  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0

  container:
    needs: gourmand  # a failed quality gate must not publish an image
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/tig
      boot: command
      boot-command: RUNTIME=podman bash tests/test-image.sh
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (default branch and v* only); without it promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
