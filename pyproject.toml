# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package, which is what `package = false` says. Without a
# lockfile that names mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "tig"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

# Lint configuration for the Python exec inputs under rootfs/. This repo ships a
# container image, not a Python package; there is nothing to build or install.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLR", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

# The probes that ship in the image, by path -- not a package. tests/ is
# checked too; mypy_path lets it resolve the probes that
# tests/test_exec_inputs.py loads with `importlib.import_module` from the
# image's install path, /usr/local/libexec/telegraf.
[tool.mypy]
files = ["rootfs/usr/local/libexec/telegraf", "tests"]
mypy_path = "rootfs/usr/local/libexec/telegraf"

# On a checkout the probes are not at /usr/local/libexec/telegraf, so the host
# pytest run finds them here. Without it, collection fails and pytest exits 2.
[tool.pytest.ini_options]
pythonpath = ["rootfs/usr/local/libexec/telegraf"]

# The probe tests need the image's install path, so the gate runs them inside
# the built image rather than on the host.
[tool.sdlc.ci]
checks = ["image", "image-tests", "gate-image", "boot-gate"]

[tool.sdlc.ci.image]
kind = "image-build"

[tool.sdlc.ci.image-tests]
kind = "pytest-in-image"
mounts = ["tests"]
tests = ["tests/test_exec_inputs.py"]

# The boot gate: tests/test-image.sh's assertions, run inside the image this PR
# builds. sdlc 0.15 does not enforce `[tool.sdlc.image] boot = "command"`
# (crunchtools/sdlc#118), and a `command` check has one container, not the
# three on a bridge network that test-image.sh drives, so tests/image-gate.sh
# runs influxd, the OTLP receiver and Grafana side by side on loopback. The
# container is the Containerfile plus `USER 1502` (tests/Containerfile.gate, a
# full copy the gate checks for drift): a command container has no
# capabilities, and Grafana's home is 0700 to that uid. A copy rather than
# `FROM localhost/tig:sdlc`, because a build of another tag is in another lane
# and may run before `image` has built it.
# Not carried over: starting the upstream mcp-grafana image (a second
# container), and influxd as uid 1501.
[tool.sdlc.ci.gate-image]
kind = "image-build"
containerfile = "tests/Containerfile.gate"
tag = "localhost/tig:gate"

[tool.sdlc.ci.boot-gate]
kind = "command"
image = "localhost/tig:gate"
argv = ["bash", "tests/image-gate.sh"]

[tool.sdlc.push]
# semgrep: no in-repo rules, and the check exits 2 when .semgrep is absent
# rather than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/tig"
# No HEALTHCHECK and no systemd: one image, three roles chosen by argument, so
# no single boot profile fits. The boot gate is the [tool.sdlc.ci] boot-gate
# check, run against this PR's built image.
boot = "none"
boot-none-reason = "one image, three roles chosen by argument, no HEALTHCHECK and no systemd; the boot gate is the [tool.sdlc.ci] boot-gate check against this PR's built image"
